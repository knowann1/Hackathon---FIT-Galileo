{% extends 'base.html' %}
{% block content %}
<h3>{{ _('Revisión de factura/recibo') }}</h3>
<div id="receipt-review-container" data-categories='{{ categories | tojson | safe }}' data-payment-methods='{{ payment_methods | tojson | safe }}'>
  {% if result %}
    <div id="receipt-result" data-receipt-result='{{ result | tojson | safe }}'></div>
    <form method="post" action="{{ url_for('receipts.confirm_receipt') }}">
      <input type="hidden" name="uploaded_filename" value="{{ uploaded_filename or '' }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">{{ _('Tipo') }}</label>
          <select name="transaction_type" class="form-select">
            <option value="expense" {% if (result.transaction_type or result.get('transaction_type','expense')) == 'expense' %}selected{% endif %}>{{ _('Egreso') }}</option>
            <option value="income" {% if (result.transaction_type or result.get('transaction_type','')) == 'income' %}selected{% endif %}>{{ _('Ingreso') }}</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">{{ _('Monto (Q)') }}</label>
          <input type="number" step="0.01" class="form-control" name="total" value="{{ result.total or result.get('total','') }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">{{ _('Moneda') }}</label>
          <input class="form-control" name="currency" value="{{ result.currency or result.get('currency','GTQ') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">{{ _('Comercio') }}</label>
          <input class="form-control" name="merchant" value="{{ result.merchant or result.get('merchant','') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">{{ _('Fecha') }}</label>
          <input type="date" class="form-control" name="expense_date" value="{{ result.expense_date or result.get('expense_date','') or result.date or result.get('date','') }}">
        </div>
        <div class="col-12">
          <label class="form-label">{{ _('Descripción') }}</label>
          <input class="form-control" name="description" value="{{ result.description or result.get('description','') }}">
        </div>
        <div class="col-md-6">
          <label class="form-label">{{ _('Número de factura') }}</label>
          <input class="form-control" name="invoice_number" value="{{ result.invoice_number or result.get('invoice_number','') }}">
        </div>
      </div>

      <div class="mb-3 mt-3">
        <label class="form-label">{{ _('Categoría') }}</label>
        <select name="category" class="form-select">
          {% for c in categories %}
            <option value="{{c}}" {% if (result.category or result.get('category','')) == c %}selected{% endif %}>{{ _(c) }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">{{ _('Método de pago') }}</label>
        <select name="payment_method" class="form-select">
          {% for p in payment_methods %}
            <option value="{{p}}" {% if (result.payment_method or result.get('payment_method','')) == p %}selected{% endif %}>{{ _(p) }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-success">{{ _('Confirmar') }}</button>
        <a class="btn btn-secondary" href="/expenses/new">{{ _('Editar') }}</a>
        <a href="/receipts/upload" class="btn btn-link">{{ _('Cancelar') }}</a>
      </div>
    </form>
  {% else %}
    <form id="receipt-upload-form" method="post" enctype="multipart/form-data">
      <div class="mb-3">
    <label class="form-label">{{ _('Archivo') }}</label>

    <div class="file-upload">
        <input
            type="file"
            name="receipt"
            id="receipt"
            accept=".png,.jpg,.jpeg,.pdf,image/png,image/jpeg,application/pdf"
            required
        >

        <label for="receipt" class="btn btn-primary">
            {{ _('Elegir archivo') }}
        </label>

        <span id="file-name">{{ _('Ningún archivo seleccionado') }}</span>
    </div>
</div>

<style>
.file-upload {
    display: flex;
    align-items: center;
    gap: 12px;
}

.file-upload input[type="file"] {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
}

.file-upload label {
    cursor: pointer;
    margin: 0;
}

#file-name {
    color: #FFFFFF;
    font-size: 0.9rem;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const fileInput = document.getElementById("receipt");
    const fileName = document.getElementById("file-name");

    fileInput.addEventListener("change", function () {
        if (this.files && this.files.length > 0) {
            fileName.textContent = this.files[0].name;
        } else {
            fileName.textContent = "{{ _('Ningún archivo seleccionado') }}";
        }
    });
});
</script>
      <button class="btn btn-primary" type="submit">{{ _('Subir y analizar') }}</button>
    </form>

    <div class="mt-3">
      <button class="btn btn-outline-secondary" data-bs-toggle="collapse" data-bs-target="#manual-entry" aria-expanded="false">{{ _('Registro manual') }}</button>
    </div>

    <div id="manual-entry" class="collapse mt-3">
      <div class="card card-body">
        <form method="post" action="/expenses/new">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row">
            <div class="mb-3 col-md-4">
              <label class="form-label">{{ _('Tipo') }}</label>
              <select name="transaction_type" class="form-select">
                <option value="expense" selected>{{ _('Egreso') }}</option>
                <option value="income">{{ _('Ingreso') }}</option>
              </select>
            </div>
            <div class="mb-3 col-md-4">
              <label class="form-label">{{ _('Monto (Q)') }}</label>
              <input type="number" step="0.01" class="form-control" name="amount" required>
            </div>            <div class="mb-3 col-md-4">
              <label class="form-label">{{ _('Moneda') }}</label>
              <input class="form-control" name="currency" value="GTQ">
            </div>
            <div class="mb-3 col-md-4">
              <label class="form-label">{{ _('Fecha') }}</label>
              <input type="date" class="form-control" name="expense_date">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _('Comercio') }}</label>
            <input class="form-control" name="merchant">
          </div>
          <div class="mb-3">
            <label class="form-label">{{ _('Descripción') }}</label>
            <input class="form-control" name="description">
          </div>
          <div class="row">
            <div class="mb-3 col-md-6">
              <label class="form-label">{{ _('Categoría') }}</label>
              <select name="category" class="form-select">
                {% for c in categories %}
                  <option value="{{c}}">{{ _(c) }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="mb-3 col-md-6">
              <label class="form-label">{{ _('Método de pago') }}</label>
              <select name="payment_method" class="form-select">
                {% for p in payment_methods %}
                  <option value="{{p}}">{{ _(p) }}</option>
                {% endfor %}
              </select>
            </div>
          </div>
          <button class="btn btn-success" type="submit">{{ _('Guardar manualmente') }}</button>
        </form>
      </div>
    </div>

    <div id="receipt-status" class="mt-3" aria-live="polite"></div>
  {% endif %}
</div>
{% endblock %}
