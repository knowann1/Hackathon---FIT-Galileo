{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Asistente financiero IA</h4>
        <a href="/dashboard" class="btn btn-sm btn-outline-secondary">Volver al panel</a>
      </div>
      <div class="card-body">
        <div id="chatMessages" class="mb-3" style="min-height: 280px; max-height: 420px; overflow-y: auto; background: #f8f9fa; border-radius: .5rem; padding: 1rem;">
          <div class="alert alert-light mb-2">Hola. Puedes preguntarme sobre tus gastos, presupuesto y metas de ahorro.</div>
        </div>
        <form id="chatForm">
          <div class="input-group">
            <input id="chatInput" type="text" class="form-control" placeholder="Haz una pregunta a la IA..." required>
            <button class="btn btn-primary" type="submit">Enviar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  const chatMessages = document.getElementById('chatMessages');
  const chatForm = document.getElementById('chatForm');
  const chatInput = document.getElementById('chatInput');

  const appendMessage = (text, isUser = false) => {
    const msg = document.createElement('div');
    msg.className = `alert ${isUser ? 'alert-primary' : 'alert-light'} mb-2`;
    msg.textContent = text;
    chatMessages.appendChild(msg);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  };

  chatForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = chatInput.value.trim();
    if (!message) return;

    appendMessage(message, true);
    chatInput.value = '';

    try {
      const _csrf = document.querySelector('meta[name="csrf-token"]')?.content || '';
      const response = await fetch('/api/ai/chat-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': _csrf },
        body: JSON.stringify({ message })
      });
      const json = await response.json();
      appendMessage(json.reply || 'No pudimos responder en este momento. Por favor, inténtelo de nuevo.', false);
    } catch (error) {
      appendMessage('No pudimos contactar con el asistente de IA. Por favor, inténtelo de nuevo.', false);
    }
  });
</script>
{% endblock %}
